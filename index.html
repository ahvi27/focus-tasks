<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus — Task Tracker</title>
<style>
/* Change these colors to personalize your project. */
:root{--bg:#10101b;--card:#1b1b2b;--line:#323248;--text:#f3f1ff;--muted:#ada9c5;--purple:#b6a1ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#30224c 0,transparent 55%),var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;padding:40px 20px}main{max-width:720px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--purple)}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:30px}.eyebrow{color:var(--purple);font-size:12px;letter-spacing:3px}h1{font-size:clamp(32px,7vw,48px);letter-spacing:-2px;margin:14px 0}p{color:var(--muted);line-height:1.6}.stats{display:flex;gap:16px;margin:30px 0}.stat{flex:1;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}.stat strong{display:block;font-size:28px;margin-bottom:8px}.stat span{font-size:13px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}form{display:flex;gap:10px}input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:15px;font-size:15px}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--purple);color:#19132b;font-weight:700}button:hover{filter:brightness(1.12)}:focus-visible{outline:3px solid var(--purple);outline-offset:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}.filters button{background:transparent;color:var(--muted);font-size:13px}.filters button[aria-pressed=true]{background:#38304d;color:var(--text)}ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}li label{flex:1;overflow-wrap:anywhere;line-height:1.5}input[type=checkbox]{width:20px;height:20px;accent-color:var(--purple);cursor:pointer;flex-shrink:0}.done label{text-decoration:line-through;color:var(--muted)}.delete{background:transparent;color:var(--muted);font-size:20px;padding:5px 10px}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;color:var(--muted);font-size:12px}.bottom button{background:transparent;color:var(--purple);font-size:12px;padding:8px}footer{text-align:center;color:var(--muted);font-size:12px;margin:28px 0}#notice{font-size:13px;color:var(--purple)}@media(max-width:480px){body{padding:24px 14px}header{margin-bottom:40px}.panel{padding:16px}.stat{padding:15px}.stats{gap:8px}form{flex-direction:column}.bottom{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span>◈</span> focus</div><span class="tag">ONE TASK AT A TIME</span></header>
<div class="eyebrow">YOUR DAILY SPACE</div>
<h1>Small steps. Big progress.</h1>
<p>Clear your mind, organize your tasks, and make room for what matters.</p>
<section class="stats" aria-label="Task summary">
<div class="stat"><strong id="total">0</strong><span>Total tasks</span></div>
<div class="stat"><strong id="active">0</strong><span>To do</span></div>
<div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
</section>
<section class="panel" aria-label="Task tracker">
<form id="task-form"><input id="task-input" type="text" aria-label="New task" placeholder="What would you like to get done?" maxlength="200" required autocomplete="off"><button type="submit">+ Add task</button></form>
<nav class="filters" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All tasks</button><button type="button" data-filter="active" aria-pressed="false">To do</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></nav>
<ul id="task-list"></ul><div id="empty" class="empty">Your next step starts here. Add your first task.</div>
<div class="bottom"><span id="summary" aria-live="polite">0 tasks remaining</span><button id="clear" type="button">Clear completed</button></div>
<p id="notice" role="status"></p>
</section><footer>A little focus goes a long way.</footer>
</main>
<script>
// Tasks are stored on this browser, with no account or server needed.
const storageKey = 'focus-tasks-v1';
let tasks = [];
let filter = 'all';
const notice = document.getElementById('notice');
try {
  const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
  if (Array.isArray(stored)) tasks = stored.filter(t => t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean');
} catch { notice.textContent = 'Saved tasks could not be loaded. You can still use the tracker.'; }
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
  catch { notice.textContent = 'Browser storage is unavailable. Tasks will last until you close this page.'; }
}
function render() {
  const list = document.getElementById('task-list');
  list.replaceChildren();
  const visible = tasks.filter(t => filter === 'all' || (filter === 'completed' ? t.done : !t.done));
  for (const task of visible) {
    const row = document.createElement('li');
    row.classList.toggle('done', task.done);
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.checked = task.done; checkbox.id = 'task-' + task.id;
    checkbox.addEventListener('change', () => { task.done = checkbox.checked; save(); render(); });
    const label = document.createElement('label'); label.htmlFor = checkbox.id;
    label.textContent = task.text; // textContent keeps typed text safe.
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'delete'; remove.textContent = '×';
    remove.setAttribute('aria-label', 'Delete task: ' + task.text);
    remove.addEventListener('click', () => { tasks = tasks.filter(t => t.id !== task.id); save(); render(); });
    row.append(checkbox, label, remove); list.append(row);
  }
  const done = tasks.filter(t => t.done).length;
  const remaining = tasks.length - done;
  document.getElementById('total').textContent = tasks.length;
  document.getElementById('active').textContent = remaining;
  document.getElementById('completed').textContent = done;
  document.getElementById('summary').textContent = remaining + (remaining === 1 ? ' task remaining' : ' tasks remaining');
  document.getElementById('empty').hidden = visible.length > 0;
  document.getElementById('empty').textContent = tasks.length === 0 ? 'Your next step starts here. Add your first task.' : 'No tasks in this view.';
  document.getElementById('clear').disabled = done === 0;
}
document.getElementById('task-form').addEventListener('submit', event => {
  event.preventDefault();
  const input = document.getElementById('task-input'); const text = input.value.trim();
  if (!text) { input.value = ''; input.focus(); return; }
  tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, done: false });
  input.value = ''; filter = 'all'; updateFilters(); save(); render(); input.focus();
});
function updateFilters() {
  document.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === filter)));
}
document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; updateFilters(); render(); }));
document.getElementById('clear').addEventListener('click', () => { tasks = tasks.filter(t => !t.done); save(); render(); });
render();
</script>
</body>
</html>
